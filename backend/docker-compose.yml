services:
  db:
    image: postgres:16-alpine
    container_name: aurelia-postgres
    environment:
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: aurelia
      POSTGRES_DB: aurelia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia -d aurelia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
