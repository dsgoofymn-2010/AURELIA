name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurelia
          POSTGRES_PASSWORD: aurelia
          POSTGRES_DB: aurelia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurelia -d aurelia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      ENVIRONMENT: development
      ADMIN_API_KEY: test-key
      INQUIRY_RATE_LIMIT_PER_MINUTE: "1000"
      DATABASE_URL: postgresql+asyncpg://aurelia:aurelia@localhost:5432/aurelia

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Unit tests
        working-directory: backend
        run: pytest -m "not integration" -q

      - name: Integration tests
        working-directory: backend
        run: pytest -m integration -q
